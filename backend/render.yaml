# Render Blueprint for the NoorAI backend.
# Deploy with: Render Dashboard → New → Blueprint → connect this repo.
# Render reads this file from the repo root of the imported service and
# uses `rootDir` to scope the build to backend/.
services:
  - type: web
    name: noorai-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    # The build command:
    #   1. Installs pinned dependencies.
    #   2. Runs Alembic against the configured DATABASE_URL so schema is
    #      always in sync with the code that's about to start.
    # Both embeddings (HF Inference API) and the vector store (Pinecone)
    # are hosted services — there is no local ML model to pre-download.
    buildCommand: |
      pip install --no-cache-dir -r requirements.txt
      alembic -c alembic.ini upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # --- App ---
      - key: APP_ENV
        value: prod
      - key: STORAGE_DIR
        value: /tmp/storage

      # --- Secrets / per-environment values (set in the Render dashboard) ---
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false              # set to your Vercel URL once known
      - key: FRONTEND_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false              # leave blank to use free Edge-TTS
      - key: HUGGINGFACE_API_TOKEN
        sync: false              # required — embeddings run on HF Inference API
      - key: PINECONE_API_KEY
        sync: false              # required — vector store is Pinecone serverless
      - key: PINECONE_INDEX_NAME
        value: noorai-rag
      - key: PINECONE_CLOUD
        value: aws
      - key: PINECONE_REGION
        value: us-east-1

      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "60"
