# Render Blueprint for the NoorAI backend.
# Deploy with: Render Dashboard → New → Blueprint → connect this repo.
# Render reads this file from the repo root of the imported service and
# uses `rootDir` to scope the build to backend/.
services:
  - type: web
    name: noorai-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    # The build command:
    #   1. Installs pinned dependencies.
    #   2. Pre-downloads the Whisper model and the SentenceTransformer
    #      embedding model so the first request doesn't pay a cold-start
    #      fetch tax.
    #   3. Runs Alembic against the configured DATABASE_URL so schema is
    #      always in sync with the code that's about to start.
    buildCommand: |
      pip install --no-cache-dir -r requirements.txt
      python -m app.scripts.download_whisper
      python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')"
      alembic -c alembic.ini upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # --- App ---
      - key: APP_ENV
        value: prod
      - key: STORAGE_DIR
        value: /tmp/storage
      # Whisper sized for 512 MB RAM tier. Bump to base.en on Render Standard.
      - key: WHISPER_MODEL
        value: tiny.en
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8

      # --- Secrets / per-environment values (set in the Render dashboard) ---
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false              # set to your Vercel URL once known
      - key: FRONTEND_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false              # leave blank to use free Edge-TTS
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false              # leave blank to use free Edge-TTS

      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "60"
